[pytest]
# Pytest configuration for Quill test system

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for test categorization
markers =
    unit: marks tests as unit tests with mocks (default, fast)
    integration: marks tests as integration tests (slower, real components)
    whisper: marks tests that use real Whisper models (very slow, needs model download)
    slow: marks tests as slow (deselect with '-m "not slow"')
    gpu: marks tests that require GPU/CUDA (skip on CPU-only systems)
    manual: marks tests as manual/interactive (run separately with real hardware)

# Default test selection (unit tests only, excludes integration/whisper/manual)
addopts =
    -v
    --tb=short
    --strict-markers
    -m "not integration and not whisper and not manual"
    --cov=src/Quill
    --cov-report=term-missing
    --cov-report=html
    --cov-branch

# Coverage settings
[coverage:run]
source = src/Quill
omit =
    */tests/*
    */__pycache__/*
    */site-packages/*
    .venv/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
